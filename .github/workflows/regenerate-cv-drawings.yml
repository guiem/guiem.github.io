name: Regenerate CV drawings from master originals
on:
  push:
    branches: [art/stick-figure-cv-timeline]
    paths:
      - scripts/regenerate_timeline_from_master.py
      - .github/workflows/regenerate-cv-drawings.yml
permissions:
  contents: write
jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pillow>=10,<13' 'numpy>=1.26,<3' 'opencv-python-headless>=4.9,<5'
      - name: Generate from original master JPEGs
        run: python scripts/regenerate_timeline_from_master.py
      - name: Commit resulting 13 images on existing PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/timeline/*.jpg
          git diff --cached --quiet || git commit -m "Redraw all CV timeline images from master in blue pen"
          git push
