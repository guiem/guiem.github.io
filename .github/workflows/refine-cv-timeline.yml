name: Refine CV timeline doodles
on:
  push:
    branches: [art/stick-figure-cv-timeline]
    paths:
      - scripts/refine_timeline.py
      - .github/workflows/refine-cv-timeline.yml
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Recolor illustrations and restore recognizable glasses
        run: python scripts/refine_timeline.py
      - name: Commit updated JPEGs onto this PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/timeline/*.jpg
          git diff --cached --quiet || git commit -m "Refine timeline doodles with blue ink and glasses"
          git push
